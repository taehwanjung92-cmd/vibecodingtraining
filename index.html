<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로또 번호 추첨기</title>
  <link href='/style.css' rel='stylesheet'>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9408095057036591"
       crossorigin="anonymous"></script>
</head>
<body>
  <button id="theme-toggle" aria-label="테마 전환">🌙</button>
  <div class="container">
    <h1>🎱 로또 번호 추첨기</h1>
    <p class="subtitle">버튼을 클릭하면 행운의 번호 6개를 뽑아드립니다!</p>
    <div class="lotto-numbers"></div>
    <button id="generate-btn">번호 추첨하기</button>
  </div>

  <div class="ad-banner">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-9408095057036591"
         data-ad-slot="auto"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>

  <div class="container contact-container">
    <h2>📬 제휴 문의</h2>
    <p class="subtitle">협업 및 제휴 제안을 남겨주시면 빠르게 답변드리겠습니다.</p>
    <form id="contact-form" action="https://formspree.io/f/xaqzbvgk" method="POST">
      <div class="form-group">
        <label for="name">이름</label>
        <input type="text" id="name" name="name" placeholder="홍길동" required />
      </div>
      <div class="form-group">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" placeholder="example@email.com" required />
      </div>
      <div class="form-group">
        <label for="company">회사명 (선택)</label>
        <input type="text" id="company" name="company" placeholder="회사명을 입력하세요" />
      </div>
      <div class="form-group">
        <label for="message">문의 내용</label>
        <textarea id="message" name="message" rows="4" placeholder="제휴 또는 협업 내용을 자유롭게 적어주세요." required></textarea>
      </div>
      <button type="submit" class="submit-btn">문의 보내기</button>
      <p id="form-status"></p>
    </form>
  </div>
  <div class="ad-banner">
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="ca-pub-9408095057036591"
         data-ad-slot="auto"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
    <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
  </div>

  <div class="container disqus-container">
    <h2>💬 댓글</h2>
    <div id="disqus_thread"></div>
  </div>

  <script defer type="text/javascript" src="/main.js"></script>
  <script>
    (function() {
      var d = document, s = d.createElement('script');
      s.src = 'https://vibecoding-training.disqus.com/embed.js';
      s.setAttribute('data-timestamp', +new Date());
      (d.head || d.body).appendChild(s);
    })();
  </script>
  <noscript>댓글을 보려면 JavaScript를 활성화해 주세요. <a href="https://disqus.com/?ref_noscript">Disqus 댓글 보기</a></noscript>
</body>
</html>
